# Included in Prostoj's http block. Its existing :443 stream router must send
# hooks.prostoj.store to 127.0.0.1:18483 with PROXY protocol enabled.
map $http_upgrade $taxigr_fallback_upgrade {
    default upgrade;
    '' '';
}

log_format taxigr_fallback '$remote_addr $request_method $uri $status $request_time';
upstream taxigr_fallback_origin {
    server api.taxigr.ru:443;
    keepalive 16;
}

server {
    listen 127.0.0.1:18483 ssl proxy_protocol;
    server_name hooks.prostoj.store;
    ssl_certificate /etc/letsencrypt/live/prostoj-gateway/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/prostoj-gateway/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    set_real_ip_from 127.0.0.1;
    real_ip_header proxy_protocol;
    client_max_body_size 8m;
    large_client_header_buffers 4 16k;
    access_log /var/log/nginx/taxigr-fallback.access.log taxigr_fallback;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Taxi-Transport prostoj always;

    proxy_http_version 1.1;
    proxy_set_header Host api.taxigr.ru;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    include /etc/nginx/taxigr-fallback-upstream-key.conf;
    proxy_set_header Forwarded "";
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $taxigr_fallback_upgrade;
    proxy_ssl_server_name on;
    proxy_ssl_name api.taxigr.ru;
    proxy_ssl_verify on;
    proxy_ssl_verify_depth 3;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_connect_timeout 4s;
    proxy_read_timeout 65s;
    proxy_send_timeout 35s;
    proxy_next_upstream off;
    proxy_cache off;
    proxy_buffering off;
    proxy_redirect off;
    proxy_intercept_errors off;
    error_page 502 503 504 = @taxigr_unavailable;

    location ~ ^/taxigr/v1/(?:internal|webhooks)(?:/|$) { return 404; }
    location /taxigr/v1/ { proxy_pass https://taxigr_fallback_origin/v1/; }
    location /taxigr/uploads/ { proxy_pass https://taxigr_fallback_origin/uploads/; }
    location /taxigr/socket.io/ { proxy_pass https://taxigr_fallback_origin/socket.io/; }
    location = /taxigr { return 404; }
    location /taxigr/ { return 404; }
    location @taxigr_unavailable {
        default_type application/json;
        add_header Cache-Control no-store always;
        add_header Access-Control-Allow-Origin 'https://taxigr.ru' always;
        return 503 '{"error":{"code":"PROXY_UNAVAILABLE","message":"Резервный API временно недоступен"}}';
    }

    # Existing webhook/admin routes continue through their original listener.
    location / {
        client_max_body_size 2m;
        proxy_pass http://127.0.0.1:1443;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Forwarded "";
    }
}
