# Installed as /etc/nginx/conf.d/taxigr-fallback-client-map.conf, mode 0600.
# The deploy helper replaces this placeholder with a server-only random key.
# Existing PROXY-protocol handling remains intact. Only the owned gateway with
# the private upstream header may supply a replacement client IP.
map "$remote_addr:$http_x_taxigr_proxy_key" $taxigr_request_client_ip {
    default $remote_addr;
    ~^(72[.]56[.]116[.]28|217[.]149[.]24[.]85):__SERVER_PROXY_KEY__$ $http_x_forwarded_for;
}
log_format taxigr_client_ip '$taxigr_request_client_ip $request_method $uri $status';
