name: Deploy production
'on':
  push:
    branches:
      - main
  workflow_dispatch: null
concurrency:
  group: taxigr-production
  cancel-in-progress: false
jobs:
  deploy:
    name: Tests, Expo web build and production deployment
    runs-on: gitlub-deploy
    timeout-minutes: 100
    steps:
      - name: Build and deploy exact pushed commit
        shell: bash
        env:
          DEPLOY_COMMIT: ${{ forgejo.sha }}
          DEPLOY_BRANCH: ${{ forgejo.ref_name }}
          BUILD_SSH_HOST: ${{ vars.BUILD_SSH_HOST }}
          BUILD_SSH_PRIVATE_KEY: ${{ secrets.BUILD_SSH_PRIVATE_KEY }}
          BUILD_SSH_KNOWN_HOSTS: ${{ secrets.BUILD_SSH_KNOWN_HOSTS }}
          ACTION_VARIABLES: ${{ toJSON(vars) }}
          ACTION_SECRETS: ${{ toJSON(secrets) }}
          BUILD_SSH_CONNECT_HOST: ${{ vars.BUILD_SSH_CONNECT_HOST || vars.BUILD_SSH_HOST }}
          BUILD_SSH_CONNECT_PORT: ${{ vars.BUILD_SSH_CONNECT_PORT || '22' }}
        run: >
          set -euo pipefail

          [[ "$DEPLOY_COMMIT" =~ ^[0-9a-f]{40}$ ]]

          test "$DEPLOY_BRANCH" = main

          umask 077

          directory=$(mktemp -d)

          trap 'rm -f "$directory/key" "$directory/known_hosts" "$directory/settings.json"; rmdir
          "$directory"' EXIT

          printf '%s\n' "$BUILD_SSH_PRIVATE_KEY" > "$directory/key"

          printf '%s\n' "$BUILD_SSH_KNOWN_HOSTS" > "$directory/known_hosts"

          python3 - <<'PY' > "$directory/settings.json"

          import json,os,sys

          variables=json.loads(os.environ['ACTION_VARIABLES'])

          secrets=json.loads(os.environ['ACTION_SECRETS'])

          json.dump({
           'variables':{k.removeprefix('PRODUCTION_'):v for k,v in variables.items() if k.startswith('PRODUCTION_')},
           'secrets':{k.removeprefix('PRODUCTION_'):v for k,v in secrets.items() if k.startswith('PRODUCTION_') and not k.startswith('PRODUCTION_SSH_')}
          },sys.stdout)

          PY

          unset ACTION_SECRETS BUILD_SSH_PRIVATE_KEY BUILD_SSH_KNOWN_HOSTS

          ssh -T -i "$directory/key" -p "$BUILD_SSH_CONNECT_PORT" -o "HostName=$BUILD_SSH_CONNECT_HOST" -o
          "HostKeyAlias=$BUILD_SSH_HOST" -o IdentitiesOnly=yes -o BatchMode=yes \
            -o StrictHostKeyChecking=yes -o UserKnownHostsFile="$directory/known_hosts" \
            -o ConnectTimeout=20 -o ConnectionAttempts=3 -o ServerAliveInterval=30 -o ServerAliveCountMax=15 \
            "root@$BUILD_SSH_HOST" "deploy $DEPLOY_BRANCH $DEPLOY_COMMIT" < "$directory/settings.json"
