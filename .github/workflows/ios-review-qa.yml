name: iOS review QA

on:
  workflow_dispatch:
  push:
    branches: ['codex/ios-review-qa-*']

permissions:
  contents: read

jobs:
  native-ui:
    name: Review on ${{ matrix.device }}
    runs-on: xcode-27
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        device: [ipad]
    env:
      TAXIGR_IOS_QA_DEVICE: ${{ matrix.device }}
      TAXIGR_IOS_QA_RUNTIME: '27.0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install the verified Maestro version
        env:
          MAESTRO_VERSION: 2.11.0
        run: |
          curl -fsSL https://get.maestro.mobile.dev | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Download the compiled simulator app
        env:
          TAXIGR_IOS_QA_APP_ARCHIVE: ${{ secrets.TAXIGR_IOS_QA_APP_ARCHIVE }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          import {pipeline} from 'node:stream/promises';
          const url=new URL(process.env.TAXIGR_IOS_QA_APP_ARCHIVE);
          if(url.protocol!=='https:'||url.username||url.password)throw Error('Invalid simulator archive URL');
          const root=path.resolve('tmp/ios-review-app');fs.mkdirSync(root,{recursive:true});
          const archive=path.join(root,'app.tar.gz');
          const r=await fetch(url,{signal:AbortSignal.timeout(120000)});if(!r.ok)throw Error('Simulator archive HTTP '+r.status);
          await pipeline(r.body,fs.createWriteStream(archive));
          const members=execFileSync('tar',['-tzf',archive],{encoding:'utf8'}).split('\n');
          if(members.some(n=>n.startsWith('/')||n.split('/').includes('..')))throw Error('Unsafe archive path');
          execFileSync('tar',['-xzf',archive,'-C',root]);
          const find=p=>fs.readdirSync(p,{withFileTypes:true}).flatMap(x=>x.name.endsWith('.app')?[path.join(p,x.name)]:x.isDirectory()?find(path.join(p,x.name)):[]);
          const apps=find(root);if(apps.length!==1)throw Error('Expected one simulator app');
          fs.appendFileSync(process.env.GITHUB_ENV,'TAXIGR_IOS_QA_APP_PATH='+apps[0]+'\n');
          JS
      - name: Test native screens
        run: node scripts/ios-review-qa.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-review-qa-${{ matrix.device }}
          path: artifacts/ios-native-qa
          retention-days: 7
