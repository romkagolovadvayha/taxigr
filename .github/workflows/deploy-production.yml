name: Deploy production
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH
        timeout-minutes: 2
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/taxigr_deploy
          chmod 600 ~/.ssh/taxigr_deploy
          ssh-keygen -y -f ~/.ssh/taxigr_deploy >/dev/null
          printf '%s\n' '212.193.26.91 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbG3rc2WM6IYC/bg293sBMj5kcRP7+1qpOUX83u9CEH' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host taxigr-production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/taxigr_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Upload one-time collector setup
        run: scp .github/group-bridge-bootstrap.cjs "taxigr-production:/var/www/taxigr/incoming/group-setup-${GITHUB_SHA}.cjs"
      - name: Verify owner and provision collector
        env:
          GROUP_ALERT_SETUP_JSON: ${{ secrets.GROUP_ALERT_SETUP_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GROUP_ALERT_SETUP_JSON" | ssh taxigr-production "cd /var/www/taxigr/current && set -a && . /etc/taxigr/taxigr.env && set +a && node /var/www/taxigr/incoming/group-setup-${GITHUB_SHA}.cjs setup"
      - name: Verify test alert reaches only administrator bots
        env:
          GROUP_ALERT_SETUP_JSON: ${{ secrets.GROUP_ALERT_SETUP_JSON }}
        run: |
          set -euo pipefail
          printf '%s' "$GROUP_ALERT_SETUP_JSON" | ssh taxigr-production "cd /var/www/taxigr/current && set -a && . /etc/taxigr/taxigr.env && set +a && node /var/www/taxigr/incoming/group-setup-${GITHUB_SHA}.cjs verify"
      - name: Remove one-time server helper
        if: always()
        run: ssh taxigr-production "rm -f /var/www/taxigr/incoming/group-setup-${GITHUB_SHA}.cjs"
