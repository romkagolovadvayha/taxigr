name: Install or repair QEMU guest agent
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_PORT: ${{ vars.SSH_PORT }}
      SSH_USER: ${{ vars.SSH_USER }}
    steps:
      - uses: actions/checkout@v7
      - name: Setup SSH
        timeout-minutes: 2
        shell: bash
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.SSH_PRIVATE_KEY_B64 }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/taxigr_deploy
          chmod 600 ~/.ssh/taxigr_deploy
          ssh-keygen -y -f ~/.ssh/taxigr_deploy >/dev/null
          printf '%s\n' '212.193.26.91 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAINbG3rc2WM6IYC/bg293sBMj5kcRP7+1qpOUX83u9CEH' > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host taxigr-production
            HostName $SSH_HOST
            Port $SSH_PORT
            User $SSH_USER
            IdentityFile ~/.ssh/taxigr_deploy
            IdentitiesOnly yes
            BatchMode yes
            StrictHostKeyChecking yes
            ConnectTimeout 15
            ServerAliveInterval 15
            ServerAliveCountMax 3
          EOF
          chmod 600 ~/.ssh/config

      - name: Install missing guest agent and verify application health
        shell: bash
        run: |
          set -euo pipefail
          ssh taxigr-production "node -" < .github/qemu-agent-maintenance.cjs
