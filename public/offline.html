<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#FFD600" />
    <meta name="robots" content="noindex" />
    <title>Нет связи · Такси Грахово</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #f4f4f2;
        color: #171715;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      main {
        width: min(100%, 420px);
        padding: 28px;
        border: 1px solid #deded8;
        border-radius: 28px;
        background: #fff;
        box-shadow: 0 18px 44px rgba(23, 23, 21, 0.1);
      }
      .mark {
        width: 64px;
        height: 64px;
        display: grid;
        place-items: center;
        border-radius: 22px;
        background: #ffd600;
        font-size: 32px;
      }
      h1 { margin: 22px 0 10px; font-size: 28px; line-height: 1.1; }
      p { margin: 0; color: #64645f; font-size: 16px; line-height: 1.5; }
      button {
        width: 100%;
        min-height: 54px;
        margin-top: 24px;
        border: 0;
        border-radius: 18px;
        background: #ffd600;
        color: #171715;
        font: inherit;
        font-weight: 700;
      }
      button:active { transform: scale(0.99); }
      #status { margin-top: 12px; min-height: 24px; font-size: 14px; text-align: center; }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">🚕</div>
      <h1>Нет связи</h1>
      <p>Если заказ уже был отправлен, он сохранён на сервере. Проверьте интернет и снова откройте приложение.</p>
      <button id="retry" type="button">Попробовать снова</button>
      <p id="status" role="status" aria-live="polite"></p>
    </main>
    <script>
      const status = document.getElementById('status');
      const retry = () => {
        status.textContent = 'Проверяем соединение…';
        window.location.reload();
      };
      document.getElementById('retry').addEventListener('click', retry);
      window.addEventListener('online', retry, { once: true });
    </script>
  </body>
</html>
